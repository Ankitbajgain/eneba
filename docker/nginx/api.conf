root /var/www/backend/public;
server_tokens off;
client_max_body_size 8m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;

location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
}

location = /api { rewrite ^ /api/ last; }
location /api/ { try_files $uri /index.php?$query_string; }
location /sanctum/ { try_files $uri /index.php?$query_string; }

location = /index.php {
    try_files /index.php =503;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_HOST $http_host;
    fastcgi_pass backend:9000;
    fastcgi_hide_header X-Powered-By;
}
location ~ \.php(?:/|$) { return 404; }
location ~ /\. { deny all; }
