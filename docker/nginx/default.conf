# Existing same-origin application gateway.
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/marketplace-api.conf;

    # Vite's public dependency bundles contain a dot-directory; allow this exact
    # dev asset prefix while the shared API configuration still denies .env/.git.
    location ^~ /node_modules/.vite/deps/ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Dedicated backend HTTP listener, published as BACKEND_PORT on the host.
server {
    listen 8081;
    server_name _;
    include /etc/nginx/snippets/marketplace-api.conf;

    location / { return 404; }
}
