[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/marketplace-supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=php-fpm -F
autorestart=true
startretries=5
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /etc/nginx/nginx-vercel.conf
autorestart=true
startretries=5
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
