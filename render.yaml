# Free Render PostgreSQL expires after 30 days; arrange pg_dump exports.
services:
- type: web
  name: eneba-marketplace
  runtime: docker
  plan: free
  region: frankfurt
  repo: https://github.com/Ankitbajgain/eneba
  dockerfilePath: ./docker/php/Dockerfile
  dockerContext: .
  healthCheckPath: /api/v1/health
  autoDeployTrigger: 'off'
  envVars:
  - key: PORT
    value: '8080'
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: 'false'
  - key: APP_URL
    sync: false
  - key: APP_KEY
    sync: false
  - key: KEY_FINGERPRINT_SECRET
    sync: false
  - key: DB_CONNECTION
    value: pgsql
  - key: DB_URL
    fromDatabase:
      name: eneba-postgres
      property: connectionString
  - key: SESSION_DRIVER
    value: database
  - key: SESSION_COOKIE
    value: marketplace_session
  - key: SESSION_DOMAIN
    value: ''
  - key: SESSION_SECURE_COOKIE
    value: 'true'
  - key: SANCTUM_STATEFUL_DOMAINS
    sync: false
  - key: CACHE_STORE
    value: database
  - key: CACHE_LIMITER
    value: database
  - key: QUEUE_CONNECTION
    value: sync
  - key: LOG_CHANNEL
    value: stderr
  - key: LOG_LEVEL
    value: warning
  - key: DEMO_PAYMENTS_ENABLED
    value: 'true'
  - key: TRUSTED_PROXIES
    value: '*'
  - key: DB_SSLMODE
    value: require
databases:
- name: eneba-postgres
  databaseName: marketplace
  user: marketplace
  plan: free
  region: frankfurt
  postgresMajorVersion: '17'
  ipAllowList: []
