name: ${COMPOSE_PROJECT_NAME:-eneba}

x-php: &php
  image: eneba-php:local
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      PHP_IMAGE: ${PHP_IMAGE:-php:8.3-fpm-bookworm}
  working_dir: /var/www/backend
  volumes:
    - ./backend:/var/www/backend
  networks:
    - application

services:
  database:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-marketplace}
      MYSQL_USER: ${MYSQL_USER:-marketplace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/prepare-test-db.sh:/opt/marketplace/prepare-test-db.sh:ro
    networks:
      - application
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -Nse "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    <<: *php
    restart: unless-stopped
    expose:
      - "9000"
    environment: &backend-environment
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-marketplace}
      DB_USERNAME: ${MYSQL_USER:-marketplace}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SESSION_DRIVER: database
      SESSION_COOKIE: marketplace_session
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: localhost:${HTTP_PORT:-8080},localhost:${FRONTEND_PORT:-5173},localhost:${BACKEND_PORT:-8000},127.0.0.1:${HTTP_PORT:-8080},127.0.0.1:${FRONTEND_PORT:-5173},127.0.0.1:${BACKEND_PORT:-8000}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/fpm-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:slim}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      DEV_SERVER_PORT: "5173"
      API_PROXY_TARGET: http://nginx:8081
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-modules:/workspace/frontend/node_modules
    networks:
      - application
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${BACKEND_PORT:-8000}:8081"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/api.conf:/etc/nginx/snippets/marketplace-api.conf:ro
      - ./backend:/var/www/backend:ro
    networks:
      - application
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 6

  composer:
    <<: *php
    profiles: [tools]
    entrypoint: [composer]

  test:
    <<: *php
    profiles: [tools]
    environment:
      <<: *backend-environment
      APP_ENV: testing
      DB_DATABASE: ${MYSQL_DATABASE:-marketplace}_test
      CACHE_LIMITER: array
      SESSION_DRIVER: array
    entrypoint: [sh, /var/www/backend/tests/run.sh]
    depends_on:
      database:
        condition: service_healthy

  node:
    image: ${NODE_IMAGE:-node:slim}
    profiles: [tools]
    user: node
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - frontend-modules:/workspace/frontend/node_modules
    networks:
      - application
    entrypoint: [npm]

networks:
  application:
    driver: bridge

volumes:
  mysql-data:
  frontend-modules:
