name: ${COMPOSE_PROJECT_NAME:-eneba}

x-php: &php
  image: eneba-php:local
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
      PHP_IMAGE: ${PHP_IMAGE:-php:8.3-fpm-bookworm}
  working_dir: /var/www/backend
  volumes:
    - ./backend:/var/www/backend
  networks:
    - application

services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/prepare-postgres-test-db.sh:/opt/marketplace/prepare-test-db.sh:ro
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  adminer:
    image: ${ADMINER_IMAGE:-adminer:standalone}
    restart: unless-stopped
    ports: ["127.0.0.1:${DATABASE_ADMIN_PORT:-8888}:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: database
    networks: [application]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -d, allow_url_fopen=1, -r, "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    <<: *php
    restart: unless-stopped
    expose:
      - "9000"
    environment: &backend-environment
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_SSLMODE: disable
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DATABASE:-marketplace}
      DB_USERNAME: ${POSTGRES_USER:-marketplace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SESSION_DRIVER: database
      SESSION_COOKIE: marketplace_session
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: localhost:${HTTP_PORT:-8080},localhost:${FRONTEND_PORT:-5173},localhost:${BACKEND_PORT:-8000},127.0.0.1:${HTTP_PORT:-8080},127.0.0.1:${FRONTEND_PORT:-5173},127.0.0.1:${BACKEND_PORT:-8000}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/fpm-healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:slim}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      DEV_SERVER_PORT: "5173"
      API_PROXY_TARGET: http://nginx:8081
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-modules:/workspace/frontend/node_modules
    networks:
      - application
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${BACKEND_PORT:-8000}:8081"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/api.conf:/etc/nginx/snippets/marketplace-api.conf:ro
      - ./backend:/var/www/backend:ro
    networks:
      - application
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 6

  composer:
    <<: *php
    profiles: [tools]
    entrypoint: [composer]

  test:
    <<: *php
    profiles: [tools]
    environment:
      <<: *backend-environment
      APP_ENV: testing
      DB_DATABASE: ${POSTGRES_DATABASE:-marketplace}_test
      CACHE_LIMITER: array
      SESSION_DRIVER: array
    entrypoint: [sh, /var/www/backend/tests/run.sh]
    depends_on:
      database:
        condition: service_healthy

  node:
    image: ${NODE_IMAGE:-node:slim}
    profiles: [tools]
    user: node
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - frontend-modules:/workspace/frontend/node_modules
    networks:
      - application
    entrypoint: [npm]

networks:
  application:
    driver: bridge

volumes:
  postgres-data:
  frontend-modules:
