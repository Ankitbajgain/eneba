name: ${COMPOSE_PROJECT_NAME:-eneba-vercel}

# Local rehearsal of the Vercel HTTP container with a separate persistent PostgreSQL.
services:
  database:
    extends: {file: compose.production.yaml, service: database}

  backend:
    extends: {file: compose.production.yaml, service: backend}
    image: eneba-vercel:production
    build:
      target: vercel
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:slim}
    environment:
      PORT: "8080"
      PHP_FPM_UPSTREAM: 127.0.0.1:9000
    ports: ["127.0.0.1:${RELEASE_HTTP_PORT:-9080}:8080"]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/health') === false ? 1 : 0);"]

  release:
    extends: {file: compose.production.yaml, service: release}

  backup:
    extends: {file: compose.production.yaml, service: backup}

networks:
  application: {driver: bridge}
volumes:
  postgres-production:
