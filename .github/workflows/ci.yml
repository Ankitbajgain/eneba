name: Application checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: node
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: marketplace_test
          MYSQL_USER: marketplace
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: marketplace_test
      DB_USERNAME: marketplace
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, zip, bcmath
          coverage: none
      - run: cp .env.example .env
        working-directory: backend
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: composer check-platform-reqs
        working-directory: backend
      - run: php artisan key:generate
        working-directory: backend
      - run: php artisan migrate --force
        working-directory: backend
      - run: vendor/bin/pint --test
        working-directory: backend
      - run: php artisan test
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build backend frontend
      - run: cp backend/.env.example backend/.env
      - run: docker compose run --rm --no-deps composer install --no-interaction --prefer-dist
      - run: docker compose up -d --wait database
      - run: docker compose run --rm --no-deps backend php artisan key:generate
      - run: docker compose run --rm --no-deps backend php artisan migrate --force
      - run: docker compose run --rm --no-deps backend php artisan db:seed --force
      - run: docker compose up -d --wait
      - run: ./scripts/check-auth.ps1
        shell: pwsh
      - if: always()
        run: docker compose down
