name: Application checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: node
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: test-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U marketplace -d marketplace_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: marketplace_test
      DB_USERNAME: marketplace
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, mbstring, intl, zip, bcmath
          coverage: none
      - run: cp .env.example .env
        working-directory: backend
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: composer check-platform-reqs
        working-directory: backend
      - run: php artisan key:generate
        working-directory: backend
      - run: php artisan migrate --force
        working-directory: backend
      - run: vendor/bin/pint --test
        working-directory: backend
      - run: php artisan test
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build backend frontend
      - run: cp backend/.env.example backend/.env
      - run: docker compose run --rm --no-deps composer install --no-interaction --prefer-dist
      - run: docker compose up -d --wait database
      - run: docker compose run --rm --no-deps backend php artisan key:generate
      - run: docker compose run --rm --no-deps backend php artisan migrate --force
      - run: docker compose run --rm --no-deps backend php artisan db:seed --force
      - run: docker compose up -d --wait
      - run: ./scripts/check-auth.ps1
        shell: pwsh
      - if: always()
        run: docker compose down

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/initialize-release.ps1 -AppUrl http://localhost:9080 -AllowLocalHttp -ProjectName eneba-ci
        shell: pwsh
      - run: docker compose --env-file .env.production -f compose.render.yaml config --quiet
      - run: docker compose --env-file .env.production -f compose.render.yaml build backend release
      - run: docker compose --env-file .env.production -f compose.render.yaml up -d --wait database
      - run: docker compose --env-file .env.production -f compose.render.yaml run --rm release migrate --force
      - run: docker compose --env-file .env.production -f compose.render.yaml run --rm release db:seed --force
      - run: docker compose --env-file .env.production -f compose.render.yaml up -d --wait backend
      - run: |
          curl --fail --silent http://localhost:9080/api/v1/health
          curl --fail --silent http://localhost:9080/products/elden-ring > /dev/null
      - run: docker compose --env-file .env.production -f compose.render.yaml run --rm backup
      - if: always()
        run: docker compose --env-file .env.production -f compose.render.yaml down
